<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Costcade</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --text: #1c2026; --muted: #5d6570; --line: #d9dde3;
    --ok: #1f7a43; --warn: #8a5a00; --bad: #b3261e; --accent: #2457c5;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14171b; --panel: #1d2127; --text: #e8eaed; --muted: #9aa3ad; --line: #333a43;
      --ok: #5cc98a; --warn: #f0b94d; --bad: #ff8a80; --accent: #8ab4ff;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.45 system-ui, sans-serif; }
  header { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px; padding: 12px 16px; background: var(--panel); border-bottom: 1px solid var(--line); }
  h1 { margin: 0; font-size: 20px; }
  h2 { margin: 0 0 8px; font-size: 14px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
  #banner { flex: 1 1 280px; font-weight: 600; }
  #banner.ok { color: var(--ok); } #banner.warn { color: var(--warn); } #banner.bad { color: var(--bad); }
  #clock { color: var(--muted); font-variant-numeric: tabular-nums; }
  button { font: inherit; padding: 6px 12px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); color: var(--text); cursor: pointer; }
  button:hover { border-color: var(--accent); }
  main { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 16px; padding: 16px; }
  @media (max-width: 860px) { main { grid-template-columns: 1fr; } }
  section { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; margin-bottom: 16px; }
  #cy { height: 68vh; min-height: 420px; }
  .hint, .note { margin: 8px 0 0; color: var(--muted); font-size: 13px; }
  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  th, td { padding: 4px 6px; text-align: right; border-bottom: 1px solid var(--line); }
  th:first-child, td:first-child { text-align: left; }
  th { color: var(--muted); font-weight: 500; font-size: 13px; }
  tr.total td { font-weight: 700; }
  ol { margin: 0; padding-left: 20px; }
  li { margin-bottom: 10px; }
  .detail { color: var(--muted); font-size: 13px; }
  .tag { display: inline-block; margin-top: 2px; padding: 1px 8px; border-radius: 10px; font-size: 12px; font-weight: 600; border: 1px solid currentColor; }
  .tag.yes { color: var(--ok); } .tag.no { color: var(--muted); }
</style>
</head>
<body>
<header>
  <h1>Costcade</h1>
  <div id="banner" role="status" aria-live="polite">Connecting…</div>
  <span id="clock"></span>
  <button id="clear" type="button">Clear faults</button>
</header>
<main>
  <section>
    <h2>Building dependencies</h2>
    <div id="cy" role="img" aria-label="Building dependency graph. Node colors and labels show status."></div>
    <p class="hint">Click a node to inject a fault; click a faulted node to clear it. Dashed arrows are soft dependencies (degraded, not down).</p>
  </section>
  <aside>
    <section>
      <h2>SLA cost</h2>
      <div id="cost"></div>
    </section>
    <section>
      <h2>Recommended actions</h2>
      <ol id="actions"></ol>
      <p class="note">Recommendations only; nothing is executed. Durations and dollar figures are assumed.</p>
    </section>
  </aside>
</main>
<script src="/static/cytoscape.min.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
